<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeVote | 세종대 시험 시간 투표 서비스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="nav">
    <span class="nav-logo">exam<span>poll</span></span>
    <div>
      <span class="nav-user" id="nav-user">로그인 전</span>
      <span id="nav-logout" onclick="logout()" style="display:none; color:var(--color-danger); cursor:pointer; font-size:12px; margin-left:10px; font-weight:600; text-decoration:underline;">로그아웃</span>
    </div>
  </div>

  <div class="step-tabs" id="tabs">
    <div class="step-tab active" onclick="goTab(0)">로그인</div>
    <div class="step-tab" id="tab-admin" onclick="goTab(1)" style="display:none;">투표 개설</div>
    <div class="step-tab" onclick="goTab(2)">학생 투표</div>
    <div class="step-tab" onclick="goTab(3)">결과 조회</div>
  </div>

  <div class="screen active" id="s0">
    <div class="card" id="login-card">
      <p class="page-title">교수 로그인</p>
      <p class="page-sub">투표 공간을 개설하려면 로그인이 필요합니다.</p>
      
      <label>이메일</label>
      <input type="email" id="login-email" placeholder="professor@sejong.ac.kr" />
      
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="••••••••" />
      
      <label>교수명 (학생들에게 노출됩니다)</label>
      <input type="text" id="login-name" placeholder="예: 홍길동" />
      
      <button class="btn btn-primary btn-full" onclick="doLogin()">로그인</button>
      
      <p style="text-align:center; margin-top:16px; font-size:13px; color:var(--color-text-sub);">
        아직 계정이 없으신가요? 
        <span style="color:var(--color-primary); cursor:pointer; font-weight:600; text-decoration:underline;" onclick="toggleSignup(true)">회원가입</span>
      </p>
    </div>

    <div class="card" id="signup-card" style="display:none;">
      <p class="page-title">교수 회원가입</p>
      <p class="page-sub">세종대학교 이메일(@sejong.ac.kr)로만 가입할 수 있습니다.</p>
      
      <label>이메일 <span style="color:#E24B4A;">*</span></label>
      <input type="email" id="signup-email" placeholder="professor@sejong.ac.kr" />
      
      <label>비밀번호 <span style="color:#E24B4A;">*</span></label>
      <input type="password" id="signup-pw" placeholder="••••••••" />
      
      <label>비밀번호 확인 <span style="color:#E24B4A;">*</span></label>
      <input type="password" id="signup-pw-confirm" placeholder="••••••••" />
      
      <label>교수명 <span style="color:#E24B4A;">*</span></label>
      <input type="text" id="signup-name" placeholder="예: 홍길동" />
      
      <button class="btn btn-primary btn-full" onclick="doSignup()">가입하기</button>
      
      <p style="text-align:center; margin-top:16px; font-size:13px; color:var(--color-text-sub);">
        이미 계정이 있으신가요? 
        <span style="color:var(--color-primary); cursor:pointer; font-weight:600; text-decoration:underline;" onclick="toggleSignup(false)">로그인하기</span>
      </p>
    </div>
  </div>

  <div class="screen" id="s1">
    <div class="card">
      <p class="page-title">새 투표 공간 개설</p>
      <label>과목명</label>
      <input type="text" id="poll-name" placeholder="예: 자료구조 보강" /> 
      <label>분반</label>
      <input type="text" id="poll-section" placeholder="예: 01분반" /> 
      <label>후보 시간대 추가</label>
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <input type="datetime-local" id="slot-input" style="flex:1;" />
        <button class="btn btn-sm" onclick="addSlot()">추가</button>
      </div>
      <div id="slot-list"></div> 
      <button class="btn btn-primary btn-full" onclick="createPoll()" style="margin-top:10px;">투표 공간 생성</button>
    </div>
  </div>

  <div class="screen" id="s2">
    <div class="card" id="student-list-view">
      <p class="page-title">진행 중인 투표 목록</p>
      <p class="page-sub">참여할 과목을 검색하고 선택해주세요.</p>
      <input type="text" id="search-input" placeholder="🔍 과목명 또는 분반 검색" onkeyup="renderStudentPollList()" style="margin-bottom: 16px;" />
      <div id="student-poll-list"></div>
    </div>

    <div class="card" id="student-detail-view" style="display:none;">
      <button class="btn btn-sm" onclick="backToPollList()" style="margin-bottom:16px; background:var(--color-bg-base);">← 목록으로 돌아가기</button>
      
      <p class="page-title" id="student-poll-title"></p>
      <p class="page-sub" id="student-poll-sub"></p>
      
      <label>이름 <span style="color:#E24B4A;">*</span></label>
      <input type="text" id="voter-name" placeholder="본인 이름을 입력하세요" />
      
      <label>학번 <span style="color:#E24B4A;">*</span> <span style="font-weight:normal; color:var(--color-text-sub);">(최초 1회 입력 시 자동 저장)</span></label>
      <input type="text" id="voter-id" placeholder="예: 23011693" />
      
      <div style="height:12px;"></div>
      <div id="vote-list-container"></div> 
      <button class="btn btn-primary btn-full" onclick="submitVote()">투표 제출</button>
    </div>
  </div>

  <div class="screen" id="s3">
    <div class="card" id="result-card">
      <p class="page-title" id="result-title">투표 결과 조회</p>
      <p class="page-sub" id="result-sub">진행 중인 투표들의 결과입니다.</p>
      <input type="text" id="result-search-input" placeholder="🔍 결과가 궁금한 과목명 또는 분반 검색" onkeyup="renderResults()" style="margin-bottom: 16px;" />
      <div id="result-list-container"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script src="js/student.js"></script>
</body>
</html>
